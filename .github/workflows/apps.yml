name: Construire les apps
on:
  push:
    branches: ["chantier/**", "main"]
  workflow_dispatch:
jobs:
  web:
    name: Site web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Verifier l envoi de notifications
        # Deux details d APNs se trompent en silence et ne se voient qu en
        # production : la signature ES256 au mauvais format, et le 410 d Apple
        # ignore. Le test fabrique sa propre clef et son propre APNs.
        run: node scripts/verifier-apns.mjs
      - name: Construire le site complet (verifie aussi les types des routes API)
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: bash scripts/build-native.sh
        env:
          NEXT_PUBLIC_API_BASE: https://favorable.day
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Poser google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Le depot est public : ce fichier n y est pas commite, il arrive par
          # un secret. Il ne contient pas de cle serveur, mais il expose le
          # numero de projet et la cle d API cliente, inutile de les afficher.
          # Sans lui, android/app/build.gradle n applique pas le greffon
          # google-services et l APK sort simplement sans notifications :
          # la construction ne casse pas.
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > android/app/google-services.json
            echo "google-services.json pose"
          else
            echo "::notice title=Notifications ignorees::pas de secret GOOGLE_SERVICES_JSON, l APK sortira sans push."
          fi

      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: favorable-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    name: App iOS (simulateur)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Utiliser le Xcode le plus recent disponible
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: bash scripts/build-native.sh
        env:
          NEXT_PUBLIC_API_BASE: https://favorable.day
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/favorable-simulateur.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: favorable-ios-simulateur
          path: favorable-simulateur.zip
          if-no-files-found: warn

  ios-testflight:
    name: iOS vers TestFlight
    runs-on: macos-15
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      EQUIPE: LD9N97K83G
    steps:
      - uses: actions/checkout@v4

      - name: Y a-t-il de quoi signer ?
        id: verrou
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          P8: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ -n "$P12" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight ignore::Les secrets Apple ne sont pas encore poses. Rien n a ete envoye."
            echo "Les secrets Apple ne sont pas encore poses : rien n a ete envoye a TestFlight." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Utiliser le Xcode le plus recent disponible
        if: steps.verrou.outputs.pret == 'oui'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/setup-node@v4
        if: steps.verrou.outputs.pret == 'oui'
        with:
          node-version: "22"

      - run: npm ci
        if: steps.verrou.outputs.pret == 'oui'

      - run: bash scripts/build-native.sh
        if: steps.verrou.outputs.pret == 'oui'
        env:
          NEXT_PUBLIC_API_BASE: https://favorable.day

      - run: npx cap sync ios
        if: steps.verrou.outputs.pret == 'oui'

      - name: Trousseau temporaire et certificat de distribution
        if: steps.verrou.outputs.pret == 'oui'
        env:
          P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          P12_MDP: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MDP="$(openssl rand -base64 24)"
          security create-keychain -p "$MDP" "$TROUSSEAU"
          security set-keychain-settings -lut 3600 "$TROUSSEAU"
          security unlock-keychain -p "$MDP" "$TROUSSEAU"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$TROUSSEAU" -P "$P12_MDP" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MDP" "$TROUSSEAU" > /dev/null
          security list-keychains -d user -s "$TROUSSEAU" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Identites de signature disponibles :"
          security find-identity -v -p codesigning "$TROUSSEAU"

      - name: Cle App Store Connect
        if: steps.verrou.outputs.pret == 'oui'
        env:
          P8: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/cles"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/cles/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/cles/AuthKey_${KEY_ID}.p8"

      - name: Archiver
        if: steps.verrou.outputs.pret == 'oui'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Favorable.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/cles/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Exporter et envoyer a TestFlight
        if: steps.verrou.outputs.pret == 'oui'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${EQUIPE}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Favorable.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/cles/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          echo "Build ${{ github.run_number }} envoye a TestFlight (version 1.0)." >> "$GITHUB_STEP_SUMMARY"

      - name: Ranger le trousseau
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signature.keychain-db" 2>/dev/null || true
